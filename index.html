<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資訊儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 1.25rem;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 3px;
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col justify-between">

    <!-- Top Action Bar -->
    <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="text-blue-400 w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-wide">個人資訊儀表板</h1>
        </div>
        <button onclick="openSettingsModal()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-sm transition">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>設定</span>
        </button>
    </div>

    <!-- Main Grid Container -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1">
        
        <!-- Row 1, Col 1: 時間 -->
        <div class="card p-5 flex flex-col justify-between relative overflow-hidden min-h-[180px]">
            <div class="flex justify-between items-start text-slate-400">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4 text-blue-400"></i>時間</span>
                <span id="date-display" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">--/--/--</span>
            </div>
            <div class="my-auto py-2">
                <div id="time-display" class="text-4xl lg:text-5xl font-black tracking-tight font-mono text-center text-white">00:00:00</div>
            </div>
            <div id="weekday-display" class="text-right text-xs text-slate-400 font-medium">--</div>
        </div>

        <!-- Row 1, Col 2: 鐵路到站時間 -->
        <div class="card p-5 flex flex-col justify-between min-h-[180px]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="train" class="w-4 h-4 text-emerald-400"></i>鐵路到站時間</span>
                <span id="train-timer" class="text-xs text-slate-400">30s 後刷新</span>
            </div>
            <div id="train-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-slate-400 text-sm text-center py-4">載入中...</div>
            </div>
        </div>

        <!-- Row 1, Col 3: 最新足球比賽比分 -->
        <div class="card p-5 flex flex-col justify-between min-h-[180px]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i>最新足球比賽比分</span>
                <span class="text-xs text-amber-400/80 bg-amber-950/50 px-2 py-0.5 rounded border border-amber-800/50">RapidAPI</span>
            </div>
            <div id="football-list-container" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[160px]">
                <div class="text-slate-400 text-sm text-center py-4">載入中...</div>
            </div>
        </div>

        <!-- Row 2, Col 1: 股票資訊 -->
        <div class="card p-5 flex flex-col justify-between min-h-[220px]">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="trending-up" class="w-4 h-4 text-purple-400"></i>股票資訊</span>
                <span id="stock-source-badge" class="text-xs text-slate-400">載入中...</span>
            </div>
            <div id="stock-list-container" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[180px]">
                <div class="text-slate-400 text-sm text-center py-4">載入中...</div>
            </div>
        </div>

        <!-- Row 2, Col 2-3: 即時新聞 (跨欄) -->
        <div class="card p-5 md:col-span-2 flex flex-col justify-between min-h-[220px]">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="newspaper" class="w-4 h-4 text-sky-400"></i>即時新聞</span>
                <span class="text-xs text-slate-400">香港天文台/即時廣播</span>
            </div>
            <div id="news-container" class="flex-1 overflow-y-auto space-y-3 pr-1 max-h-[180px]">
                <div class="text-slate-400 text-sm text-center py-4">載入新聞數據中...</div>
            </div>
        </div>

        <!-- Row 3, Col 1-3: 天氣資訊 (底欄全寬) -->
        <div class="card p-5 md:col-span-3 min-h-[120px]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium flex items-center gap-1.5"><i data-lucide="cloud-sun" class="w-4 h-4 text-amber-300"></i>天氣資訊</span>
                <span id="weather-location" class="text-xs text-slate-400">定位中...</span>
            </div>
            <div id="weather-container" class="flex flex-wrap items-center justify-between gap-4">
                <div class="text-slate-400 text-sm py-2">獲取即時天氣資訊中...</div>
            </div>
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-lg text-white">API 與偏好設定</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4 text-sm">
                <!-- Finnhub Key -->
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Finnhub API Key</label>
                    <input type="text" id="setting-finnhub-key" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <!-- Stocks List -->
                <div>
                    <label class="block text-slate-300 font-medium mb-1">追蹤股票清單 (以逗號隔開)</label>
                    <input type="text" id="setting-stocks" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500" placeholder="0700.HK, AAPL, NVDA, MU, VTI">
                </div>
                <!-- MTR Line / Station -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-300 font-medium mb-1">港鐵路線</label>
                        <select id="setting-mtr-line" onchange="updateMtrStations()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                            <option value="TML">屯馬綫 (TML)</option>
                            <option value="TWL">荃灣綫 (TWL)</option>
                            <option value="ISL">港島綫 (ISL)</option>
                            <option value="KTL">觀塘綫 (KTL)</option>
                            <option value="EAL">東鐵綫 (EAL)</option>
                            <option value="TCL">東涌綫 (TCL)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-300 font-medium mb-1">港鐵車站</label>
                        <select id="setting-mtr-sta" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500"></select>
                    </div>
                </div>
                <!-- Football RapidAPI Key -->
                <div>
                    <label class="block text-slate-300 font-medium mb-1">RapidAPI Key (足球比分)</label>
                    <input type="text" id="setting-rapidapi-key" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="p-4 border-t border-slate-800 flex justify-end gap-2 bg-slate-900/50">
                <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium">儲存設定</button>
            </div>
        </div>
    </div>

    <script>
        // MTR station mapping
        const mtrStationsMap = {
            'TML': [{code:'TIS', name:'天水圍'}, {code:'ETS', name:'尖東'}, {code:'DIH', name:'鑽石山'}, {code:'TAW', name:'大圍'}, {code:'MOS', name:'馬鞍山'}, {code:'TUM', name:'屯門'}],
            'TWL': [{code:'CEN', name:'中環'}, {code:'ADM', name:'金鐘'}, {code:'TST', name:'尖沙咀'}, {code:'MOK', name:'旺角'}, {code:'TWE', name:'荃灣'}],
            'ISL': [{code:'HOK', name:'香港'}, {code:'CEN', name:'中環'}, {code:'CAUSEWAY', name:'銅鑼灣'}, {code:'QUB', name:'鰂魚涌'}, {code:'CHW', name:'柴灣'}],
            'KTL': [{code:'WHA', name:'黃埔'}, {code:'MOK', name:'旺角'}, {code:'DIH', name:'鑽石山'}, {code:'KOB', name:'九龍灣'}, {code:'TIK', name:'調景嶺'}],
            'EAL': [{code:'ADM', name:'金鐘'}, {code:'EXC', name:'會展'}, {code:'TAW', name:'大圍'}, {code:'SHT', name:'沙田'}, {code:'LOW', name:'羅湖'}, {code:'LBM', name:'落馬洲'}],
            'TCL': [{code:'HOK', name:'香港'}, {code:'KOW', name:'九龍'}, {code:'TSY', name:'青衣'}, {code:'TAW', name:'東涌'}]
        };

        // User Configuration
        let userConfig = {
            finnhubKey: 'da7rccpr01qj8fm7ttd0da7rccpr01qj8fm7ttdg',
            stocks: '0700.HK, AAPL, NVDA, MU, VTI',
            mtrLine: 'TML',
            mtrStation: 'TIS',
            rapidApiKey: '3b6cb50d3dmsh8663e9b3cb4ac4dp1e46a5jsn489c72119547'
        };

        // Load config from localStorage
        function loadUserConfig() {
            const saved = localStorage.getItem('dashboard_config');
            if (saved) {
                try {
                    userConfig = { ...userConfig, ...JSON.parse(saved) };
                } catch(e) {}
            }
        }

        function saveUserConfig() {
            localStorage.setItem('dashboard_config', JSON.stringify(userConfig));
        }

        // Initialize Lucide icons
        lucide.createIcons();

        // Clock Function
        function updateClock() {
            const now = new Date();
            document.getElementById('time-display').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date-display').textContent = now.toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('weekday-display').textContent = weekdays[now.getDay()];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 1. Football Scores API Integration
        async function fetchFootballData() {
            const container = document.getElementById('football-list-container');
            if (!container) return;

            const apiKey = userConfig.rapidApiKey || '3b6cb50d3dmsh8663e9b3cb4ac4dp1e46a5jsn489c72119547';

            try {
                const res = await fetch('https://free-api-live-football-data.p.rapidapi.com/football-current-live', {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': apiKey,
                        'x-rapidapi-host': 'free-api-live-football-data.p.rapidapi.com',
                        'Content-Type': 'application/json'
                    }
                });

                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const json = await res.json();

                // Extract match data from varying json properties
                let matches = [];
                if (Array.isArray(json)) {
                    matches = json;
                } else if (json.response && Array.isArray(json.response.live)) {
                    matches = json.response.live;
                } else if (json.response && Array.isArray(json.response)) {
                    matches = json.response;
                } else if (json.data && Array.isArray(json.data)) {
                    matches = json.data;
                } else if (json.results && Array.isArray(json.results)) {
                    matches = json.results;
                }

                if (!matches || matches.length === 0) {
                    container.innerHTML = '<div class="text-slate-400 text-sm text-center py-4">目前沒有進行中的即時比賽</div>';
                    return;
                }

                let html = '';
                matches.slice(0, 10).forEach(m => {
                    const homeName = m.home?.name || m.homeTeam?.name || m.teams?.home?.name || m.home || '主隊';
                    const awayName = m.away?.name || m.awayTeam?.name || m.teams?.away?.name || m.away || '客隊';
                    
                    const homeScore = m.home?.score ?? m.scores?.home ?? m.goals?.home ?? m.homeScore ?? 0;
                    const awayScore = m.away?.score ?? m.scores?.away ?? m.goals?.away ?? m.awayScore ?? 0;
                    
                    const status = m.status || m.time || m.fixture?.status?.short || 'Live';
                    const league = m.league?.name || m.tournament?.name || '即時賽事';

                    html += `
                        <div class="bg-slate-800/60 rounded-lg p-2.5 border border-slate-700/50 flex flex-col gap-1.5">
                            <div class="flex justify-between items-center text-xs text-slate-400">
                                <span class="truncate max-w-[140px]">${league}</span>
                                <span class="px-2 py-0.5 rounded bg-emerald-950/80 text-emerald-400 text-[10px] font-medium border border-emerald-800/50">${status}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs font-semibold">
                                <div class="flex-1 text-right truncate pr-2 text-slate-200">${homeName}</div>
                                <div class="px-2.5 py-0.5 bg-slate-900 rounded font-mono text-amber-400 border border-slate-700 text-xs">${homeScore} - ${awayScore}</div>
                                <div class="flex-1 text-left truncate pl-2 text-slate-200">${awayName}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error('Football API fetch error:', err);
                container.innerHTML = '<div class="text-rose-400 text-sm text-center py-4">無法載入比分數據，請檢查 API Key</div>';
            }
        }

        // 2. MTR Schedule API
        async function fetchMtrData() {
            const container = document.getElementById('train-container');
            if (!container) return;

            try {
                const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${userConfig.mtrLine}&sta=${userConfig.mtrStation}`);
                const data = await res.json();

                if (data.status === 0 || !data.data) {
                    container.innerHTML = '<div class="text-slate-400 text-sm py-2">查無該車站數據</div>';
                    return;
                }

                const key = `${userConfig.mtrLine}-${userConfig.mtrStation}`;
                const stationData = data.data[key];

                if (!stationData) {
                    container.innerHTML = '<div class="text-slate-400 text-sm py-2">暫無班次資料</div>';
                    return;
                }

                let html = '';
                ['UP', 'DOWN'].forEach(dir => {
                    const list = stationData[dir];
                    if (list && list.length > 0) {
                        const nextTrain = list[0];
                        const dest = nextTrain.dest || '未知';
                        const ttnt = nextTrain.ttnt || '0';
                        html += `
                            <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded border border-slate-700/50 text-xs">
                                <span class="text-slate-300">往 ${dest}</span>
                                <span class="text-emerald-400 font-bold font-mono">${ttnt} 分鐘</span>
                            </div>
                        `;
                    }
                });

                container.innerHTML = html || '<div class="text-slate-400 text-sm py-2">目前沒有列車資訊</div>';
            } catch (err) {
                container.innerHTML = '<div class="text-rose-400 text-sm py-2">鐵路數據讀取失敗</div>';
            }
        }

        // 3. Stock Data API
        async function fetchStockData() {
            const container = document.getElementById('stock-list-container');
            const badge = document.getElementById('stock-source-badge');
            if (!container) return;

            badge.textContent = 'Finnhub 即時';
            const stocksArr = userConfig.stocks.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

            if (stocksArr.length === 0) {
                container.innerHTML = '<div class="text-slate-400 text-sm py-2">請設定追蹤股票</div>';
                return;
            }

            let html = '';
            for (let symbol of stocksArr) {
                try {
                    let formattedSymbol = symbol;
                    if (/^\d{3,4}\.HK$/.test(symbol)) {
                        formattedSymbol = symbol.padStart(7, '0');
                    }

                    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${formattedSymbol}&token=${userConfig.finnhubKey}`);
                    const data = await res.json();

                    if (data && data.c !== undefined && data.c !== 0) {
                        const price = data.c.toFixed(2);
                        const change = (data.c - data.pc).toFixed(2);
                        const isUp = change >= 0;

                        html += `
                            <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded border border-slate-700/50 text-xs">
                                <span class="font-bold text-slate-200">${symbol}</span>
                                <div class="text-right font-mono">
                                    <div class="text-slate-100">$${price}</div>
                                    <div class="${isUp ? 'text-emerald-400' : 'text-rose-400'}">${isUp ? '+' : ''}${change}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="flex justify-between items-center bg-slate-800/30 p-2 rounded border border-slate-800 text-xs text-slate-500">
                                <span>${symbol}</span>
                                <span>查無資料</span>
                            </div>
                        `;
                    }
                } catch(e) {
                    html += `
                        <div class="flex justify-between items-center bg-slate-800/30 p-2 rounded border border-slate-800 text-xs text-rose-400">
                            <span>${symbol}</span>
                            <span>載入失敗</span>
                        </div>
                    `;
                }
            }
            container.innerHTML = html;
        }

        // 4. Real-time News API
        async function fetchNewsData() {
            const container = document.getElementById('news-container');
            if (!container) return;

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();

                let html = '';
                const keys = Object.keys(data);

                if (keys.length > 0) {
                    keys.forEach(k => {
                        const item = data[k];
                        html += `
                            <div class="bg-slate-800/50 p-2.5 rounded border border-slate-700/50 text-xs">
                                <div class="font-bold text-amber-300 mb-1">${item.name || '特別天氣警告'}</div>
                                <div class="text-slate-300 line-clamp-2">${item.actionCode || '請留意最新天氣變化與警告狀況。'}</div>
                            </div>
                        `;
                    });
                } else {
                    html = `
                        <div class="bg-slate-800/50 p-2.5 rounded border border-slate-700/50 text-xs">
                            <div class="font-bold text-sky-300 mb-1">即時新聞 / 天氣狀況正常</div>
                            <div class="text-slate-300">目前沒有生效的天氣警告或緊急特別新聞。新聞頻道運作正常。</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = '<div class="text-slate-400 text-sm py-2">無法獲取最新新聞</div>';
            }
        }

        // 5. Weather Info API
        async function fetchWeatherData() {
            const container = document.getElementById('weather-container');
            const locationEl = document.getElementById('weather-location');

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();

                if (locationEl) locationEl.textContent = '香港天文台';

                const temp = data.temperature?.data[0]?.value || '--';
                const humidity = data.humidity?.data[0]?.value || '--';
                const warning = data.warningMessage ? data.warningMessage[0] : '無特殊天氣警告';

                container.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-3xl font-bold font-mono text-amber-300">${temp}°C</div>
                        <div class="text-xs text-slate-300">
                            <div>相對濕度: <span class="font-mono text-white">${humidity}%</span></div>
                            <div class="text-slate-400 mt-0.5">${warning}</div>
                        </div>
                    </div>
                `;
            } catch(e) {
                if (container) container.innerHTML = '<div class="text-rose-400 text-sm">天氣數據讀取失敗</div>';
            }
        }

        // Modal and Config UI Controls
        function updateMtrStations() {
            const lineSelect = document.getElementById('setting-mtr-line');
            const staSelect = document.getElementById('setting-mtr-sta');
            const line = lineSelect.value;

            staSelect.innerHTML = '';
            (mtrStationsMap[line] || []).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.code;
                opt.textContent = `${s.name} (${s.code})`;
                staSelect.appendChild(opt);
            });
        }

        function openSettingsModal() {
            document.getElementById('setting-finnhub-key').value = userConfig.finnhubKey;
            document.getElementById('setting-stocks').value = userConfig.stocks;
            document.getElementById('setting-mtr-line').value = userConfig.mtrLine;
            updateMtrStations();
            document.getElementById('setting-mtr-sta').value = userConfig.mtrStation;
            document.getElementById('setting-rapidapi-key').value = userConfig.rapidApiKey;

            const modal = document.getElementById('settings-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveSettings() {
            userConfig.finnhubKey = document.getElementById('setting-finnhub-key').value.trim();
            userConfig.stocks = document.getElementById('setting-stocks').value.trim();
            userConfig.mtrLine = document.getElementById('setting-mtr-line').value;
            userConfig.mtrStation = document.getElementById('setting-mtr-sta').value;
            userConfig.rapidApiKey = document.getElementById('setting-rapidapi-key').value.trim();

            saveUserConfig();
            closeSettingsModal();

            // Refresh views
            fetchMtrData();
            fetchStockData();
            fetchFootballData();
        }

        // Timers & Init
        loadUserConfig();
        fetchMtrData();
        fetchFootballData();
        fetchStockData();
        fetchNewsData();
        fetchWeatherData();

        setInterval(fetchMtrData, 30000);
        setInterval(fetchFootballData, 60000);
        setInterval(fetchStockData, 60000);
        setInterval(fetchNewsData, 120000);
        setInterval(fetchWeatherData, 300000);
    </script>
</body>
</html>
